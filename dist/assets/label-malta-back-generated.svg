<text x="55" y="72" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff2cb">Préparée avec des ingrédients 100% naturels, Malta H</text>
<text x="55" y="96" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff2cb">est une boisson pleine de vitamines et de minéraux</text>
<text x="55" y="120" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#fff2cb">qui convient à toute la famille. La Malta H est</text>
<text x="55" y="144" font-family="Arial,sans-serif" font-size="16" fill="#fff2cb">nourrissante et délicieuse. Elle aide à bien grandir et</text>
<text x="55" y="168" font-family="Arial,sans-serif" font-size="16" fill="#fff2cb">à rester en bonne santé.</text>
