<g font-family="Georgia,serif" font-size="17" fill="#f3dca0">
 <text x="37" y="330">Prestige est une bière profondément enracinée dans le</text>
 <text x="37" y="357">patrimoine haïtien. C’est le témoignage d’une culture riche,</text>
 <text x="37" y="384">un symbole d’unité et de progrès. Prestige nous offre une</text>
 <text x="37" y="411">perspective optimiste de la vie, remplie de couleurs, de rires,</text>
 <text x="37" y="438">et d’énergie positive.</text>
</g>
<text x="37" y="479" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#f1d88b">100% ingrédients naturels · Eau, malt d’orge, sucre, houblon</text>
<text x="37" y="511" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#f1d88b">Déclaration nutritionnelle pour 100 ml</text>
<text x="37" y="534" font-family="Arial,sans-serif" font-size="13" fill="#f0d88f">Énergie · 187 kJ / 45 kcal</text>
